name: 임시 진단
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 조건 검색 소요시간 측정
        env:
          K: ${{ secrets.FOOD_API_KEY }}
        run: |
          B=http://openapi.foodsafetykorea.go.kr/api
          COND=$(python3 -c "import urllib.parse;print(urllib.parse.quote('PRDLST_DCNM=탄산음료', safe='='))")
          echo "cond=$COND"
          for rng in "1/1" "1/100" "101/200"; do
            echo "--- $rng"
            curl -sS -o /tmp/r.json --max-time 300 \
              -w "code=%{http_code} total=%{time_total}s size=%{size_download}\n" \
              "$B/$K/C002/json/$rng/$COND" || echo "실패(exit $?)"
            head -c 120 /tmp/r.json | sed "s/$K/KEY/g"; echo
          done

      - name: 동일 호출 3회 반복 (변동성 확인)
        env:
          K: ${{ secrets.FOOD_API_KEY }}
        run: |
          B=http://openapi.foodsafetykorea.go.kr/api
          COND=$(python3 -c "import urllib.parse;print(urllib.parse.quote('PRDLST_DCNM=탄산음료', safe='='))")
          for i in 1 2 3; do
            curl -sS -o /dev/null --max-time 300 \
              -w "try$i code=%{http_code} total=%{time_total}s\n" \
              "$B/$K/C002/json/1/100/$COND" || echo "try$i 실패(exit $?)"
          done

      - name: 파이썬 urllib 로 동일 호출 (스크립트와 동일 경로)
        env:
          FOOD_API_KEY: ${{ secrets.FOOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.parse
          key = os.environ["FOOD_API_KEY"]
          cond = urllib.parse.quote("PRDLST_DCNM=탄산음료", safe="=")
          url = f"http://openapi.foodsafetykorea.go.kr/api/{key}/C002/json/1/100/{cond}"
          for attempt in range(3):
              t = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      n = len(r.read())
                  print(f"try{attempt}: ok {n} bytes in {time.time()-t:.1f}s")
              except Exception as e:
                  print(f"try{attempt}: FAIL {type(e).__name__} {e} after {time.time()-t:.1f}s")
          PY
